# Per-site URLs and selectors. No secrets live here — the Gmail app password
# stays in the Keychain, and the schedule stays in the launchd plist.
#
# When a site redesigns, `bump.py probe --site <name>` dumps its catalog page;
# fix the values below against that dump rather than touching bump.py.
#
#   catalog_url   page listing everything you have for sale
#   edit_url      edit form for one listing; must contain {item_id}
#   link_pattern  substring that marks an anchor as a listing link
#   id_regex      one capture group pulling the listing id out of that href
#   edit_control  words on the "edit" link or button, as a regex, case-insensitive
#   save_control  words on the save button, same
#   reserved      badge words meaning "do not touch, it is reserved"
#   sold          badge words meaning "do not touch, it is sold"

[wallapop]
catalog_url = "https://es.wallapop.com/app/catalog/published"
edit_url = "https://es.wallapop.com/app/catalog/edit/{item_id}"
link_pattern = "/item/"
id_regex = "/item/([^/?#]+)"
edit_control = "editar|edit"
save_control = "guardar|actualizar|save|publicar"
reserved = ["reservado", "reserved"]
sold = ["vendido", "sold"]

# Vinted is not configured yet. Sign in to Vinted in the shared Chrome, run
# `python bump.py probe --site vinted`, and fill these in from the dump. Adding
# the section before the values are real would publish edits at guessed
# selectors, so it stays commented out until then.
#
# [vinted]
# catalog_url = ""
# edit_url = ""
# link_pattern = ""
# id_regex = ""
# edit_control = ""
# save_control = ""
# reserved = []
# sold = []
